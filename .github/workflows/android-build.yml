name: Android build

# Builds an installable APK on every push to main, on pull requests,
# and whenever you press "Run workflow" on the Actions tab.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      # The app targets .NET 8. global.json pins the SDK so the runner's
      # newer default SDK is not used.
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show .NET version
        run: dotnet --info

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore packages
        run: dotnet restore SukaliCareApp.csproj -p:CheckEolTargetFramework=false

      - name: Build APK
        run: >
          dotnet publish SukaliCareApp.csproj
          -f net8.0-android34.0
          -c Release
          -p:AndroidPackageFormat=apk
          -p:CheckEolTargetFramework=false
          -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT
          -o ./artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SukaliCare-android-apk
          path: ./artifacts/*-Signed.apk
          if-no-files-found: error
